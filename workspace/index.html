<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Algo-Tests Workspace</title>
<script>try{if(localStorage.getItem("algo-tests-theme")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css"></head>
<body>
<div class="theme-toggle" id="theme-toggle" role="button" tabindex="0" aria-label="Переключить тему"><span class="label" id="theme-toggle-label">Тёмная</span><div class="theme-toggle-track"><div class="theme-toggle-knob"></div></div></div>
<div class="app">
<section class="hero"><h1 class="hero-title">Algo-Tests Workspace</h1><p class="hero-sub">Рабочее пространство для тестов и идей при работе с моими торговыми инструментами</p></section>
<div class="tools-panel"><div class="cards tools"><a class="tcard" href="Market%20Profile/index.html"><div class="tcard-kind">Инструмент</div><div class="tcard-name">Market Profile</div><div class="tcard-sub">TPO-профили ES: типы дня, типы открытия, композиты · 1 тест</div></a><div class="tcard tplus" title="Новый инструмент: папка в workspace с index.md">+</div></div></div>
</div>

<script>
(function(){
  var KEY = 'algo-tests-theme';
  var el = document.getElementById('theme-toggle');
  var label = document.getElementById('theme-toggle-label');
  if (!el) return;
  function sync(){
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    label.textContent = light ? 'Светлая' : 'Тёмная';
  }
  function flip(){
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    if (light) document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', 'light');
    try { localStorage.setItem(KEY, light ? 'dark' : 'light'); } catch(e){}
    sync();
  }
  sync();
  el.addEventListener('click', flip);
  el.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
})();
</script>
</body></html>
