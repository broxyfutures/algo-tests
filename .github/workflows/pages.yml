# Публикация сайта тестов на GitHub Pages: собирает workspace/build.py и выкладывает папку workspace.
# Для публичного репозитория Actions бесплатны, лимитов на сборку нет.
name: Сайт тестов

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Собрать сайт
        working-directory: workspace
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: workspace
      - id: deploy
        uses: actions/deploy-pages@v4
